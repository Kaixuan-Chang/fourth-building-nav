<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>四教楼二维码导览</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="mini-shell">
    <header class="mini-head">
      <h1>四教楼路线查询</h1>
      <p>扫码后选择起点和终点即可查看路线</p>
    </header>

    <section class="mini-card">
      <label for="startSelect">起点</label>
      <select id="startSelect"></select>

      <label for="destSelect">终点</label>
      <select id="destSelect"></select>

      <button id="queryBtn" type="button">查看路线</button>
    </section>

    <section id="previewPanel" class="mini-card hidden">
      <div class="route-bar">
        <h2 id="routeTitle">路线预览</h2>
        <button id="zoomBtn" class="zoom-btn" type="button" aria-label="放大路线图">放大</button>
      </div>
      <div class="map-wrap" id="mapWrap">
        <div class="stage hidden" id="stage">
          <img id="floorImg" class="floor" alt="路线底图">
          <svg id="overlay" class="overlay" viewBox="0 0 1086 768" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
        </div>
        <div id="empty" class="tip">请选择起点和终点后点击“查看路线”。</div>
      </div>
    </section>
  </main>

  <div id="zoomModal" class="zoom-modal hidden" role="dialog" aria-modal="true" aria-label="路线图放大查看">
    <button id="zoomClose" class="zoom-close" type="button" aria-label="关闭放大路线图">关闭</button>
    <div class="zoom-view">
      <div class="zoom-stage" id="zoomStage">
        <img id="zoomImg" class="zoom-floor" alt="放大路线底图">
        <svg id="zoomOverlay" class="zoom-overlay" viewBox="0 0 1086 768" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      </div>
    </div>
  </div>

  <div id="photoModal" class="photo-modal hidden" role="dialog" aria-modal="true" aria-label="实景图查看">
    <button id="photoClose" class="photo-close" type="button" aria-label="关闭实景图">关闭</button>
    <div id="photoStage" class="photo-stage">
      <img id="photoImg" class="photo-img" alt="热点实景图">
    </div>
  </div>

  <script src="data/nav-data.js"></script>
  <script src="data/heat/heat-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
